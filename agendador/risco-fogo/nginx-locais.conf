# Risco de fogo do INPE (AmaView): PNGs por dia e o índice gerados pelo amaview-risco-fogo.
# Instalado em /etc/nginx/snippets/amaview-risco-fogo.conf pelo `amaview instalar`.

location /risco-fogo/ {
    root /var/cache/amaview-risco-fogo;
    types { image/png png; application/json json; }
    # Um dia observado não muda: o dia e a grade estão no nome, e formato novo vai para outra versão (vN).
    # Sem `always`: um 404 (dia ainda não gravado, ou já apagado) não pode ficar guardado por um ano.
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-risco-fogo.log;
}

# O índice muda uma vez por dia (4h30 de Brasília, ou 7h30 se o INPE atrasar).
location ~ ^/risco-fogo/v\d+/indice\.json$ {
    root /var/cache/amaview-risco-fogo;
    types { application/json json; }
    gzip on;
    gzip_types application/json;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-risco-fogo.log;
}
