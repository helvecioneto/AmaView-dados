# Nível dos rios pelo SWOT (AmaView): trechos.json gerado pelo amaview-swot.
# Instalado em /etc/nginx/snippets/amaview-swot.conf pelo `amaview instalar`.
# Só a pasta swot/ é servida: o estado.json da raiz do cache fica de fora.

location /swot/ {
    root /var/cache/amaview-swot;
    types { application/json json; }
    # O arquivo já sai comprimido (trechos.json.gz ao lado): nada de gzip por pedido.
    gzip_static on;
    # Muda uma vez por dia, no mesmo endereço: o app revalida (ETag) e só baixa se mudou.
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-swot.log;
}
