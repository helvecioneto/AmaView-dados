# Rastreio e previsão de nuvens (IR, GOES-19) do pyFortraCC para o AmaView:
# arquivos estáticos que o container pyfortracc_ir escreve em
# /var/cache/amaview-fortracc. Instalado em /etc/nginx/snippets/amaview-fortracc.conf
# e incluído no site do AmaView (ver containers/pyfortracc_IR/README.md).

location /fortracc/ {
    root /var/cache/amaview-fortracc;
    types { application/geo+json geojson; application/json json; }
    gzip on;
    gzip_types application/geo+json application/json;
    gzip_comp_level 5;
    # Um quadro nunca muda: o horário está no nome, e formato novo vai para outra versão (vN).
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-fortracc.log;
}

# O índice muda a cada quadro novo: o app pergunta a cada minuto.
location ~ ^/fortracc/v\d+/indice\.json$ {
    root /var/cache/amaview-fortracc;
    types { application/json json; }
    gzip on;
    gzip_types application/json;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-fortracc.log;
}
