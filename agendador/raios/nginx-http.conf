# Bloco http dos raios (AmaView): instalado em /etc/nginx/conf.d/amaview-raios.conf
# pelo `amaview instalar`. O location fica em snippets/amaview-raios.conf.

# Respostas por ponto (~300 B); o raios.py diz por quanto tempo guardar
# (1 dia com a janela completa no passado, 1 min no resto).
proxy_cache_path /var/cache/nginx/amaview-raios levels=1:2 keys_zone=amaview_raios:5m
                 max_size=50m inactive=7d use_temp_path=off;

limit_req_zone $binary_remote_addr zone=amaview_raios_taxa:10m rate=5r/s;
