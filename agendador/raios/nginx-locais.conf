# Raios do GOES-19 (AmaView): os quadros são arquivos do amaview-raios; a consulta
# por ponto vai ao serviço. Instalado em /etc/nginx/snippets/amaview-raios.conf
# pelo `amaview instalar`; o cache e o limite de taxa da consulta ficam em
# /etc/nginx/conf.d/amaview-raios.conf (nginx-http.conf).

# O quadro do horário corrente ainda recebe arquivos (um a cada 20 s): 1 min de cache.
location /raios/v1/quadros/ {
    root /var/cache/amaview-raios;
    types { application/json json; }
    gzip on;
    gzip_types application/json;
    gzip_comp_level 5;
    add_header Cache-Control "public, max-age=60" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-raios.log;
}

location = /raios/v1/indice.json {
    root /var/cache/amaview-raios;
    types { application/json json; }
    gzip on;
    gzip_types application/json;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-raios.log;
}

# Consulta por ponto e saúde: o raios.py já manda CORS e Cache-Control.
location ~ ^/raios/(v1/ponto|saude)$ {
    limit_req zone=amaview_raios_taxa burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8097;
    proxy_read_timeout 15s;
    proxy_cache amaview_raios;
    proxy_cache_key "$uri|$arg_lat|$arg_lon|$arg_t|$arg_h|$arg_r";
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating;
    add_header X-Cache $upstream_cache_status always;
    gzip on;
    gzip_types application/json;
    access_log /var/log/nginx/amaview-raios.log;
}
