
# HTTPS direto no IP (certificado de IP da Let's Encrypt, perfil shortlived,
# ~6 dias, renovado pelo amaview-certificado-ip.timer). Existe porque filtros
# de rede (FortiGuard, em 23/09/2026) bloqueiam o sslip.io por DNS: quem está
# atrás deles não alcança o nome, mas alcança o IP. É o endereço que o
# AmaView usa. `default_server`: conexão por IP não manda SNI.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name @IP@;

    ssl_certificate /etc/amaview/lego/certificates/@IP@.crt;
    ssl_certificate_key /etc/amaview/lego/certificates/@IP@.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:amaview_blocos:10m;

    include snippets/amaview-blocos.conf;
    include snippets/amaview-fumaca.conf;
}
