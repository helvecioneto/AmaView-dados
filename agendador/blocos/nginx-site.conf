# Site dos blocos do AmaView. Gerado pelo `amaview instalar` a partir deste
# modelo; o bloco 443 só entra quando existe o certificado (`amaview certificado`).

open_file_cache max=20000 inactive=120s;

server {
    listen 80;
    listen [::]:80;
    server_name @NOME@ @IP@;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    include snippets/amaview-blocos.conf;
    include snippets/amaview-fumaca.conf;
}
