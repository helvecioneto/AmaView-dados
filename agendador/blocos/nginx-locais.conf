# Blocos do GOES-19 (AmaView): o disco primeiro; o que falta é cortado na hora.
# Instalado em /etc/nginx/snippets/amaview-blocos.conf pelo `amaview instalar`.

location /blocos/v1/ {
    root /var/cache/amaview-blocos;
    try_files $uri @blocos;
    # Um bloco nunca muda: o horário e a largura estão no caminho.
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-blocos.log;
}

# O blocos.py já manda CORS e cache: repetir o cabeçalho aqui faria o navegador
# ver "*, *" e recusar a resposta.
location @blocos {
    proxy_pass http://127.0.0.1:8090;
    proxy_read_timeout 90s;
    access_log /var/log/nginx/amaview-blocos.log;
}

location = /blocos/saude {
    proxy_pass http://127.0.0.1:8090;
}
