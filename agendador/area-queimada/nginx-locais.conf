# Área atingida pelo fogo (AmaView): arquivos por período gerados pelo amaview-area-queimada.
# Instalado em /etc/nginx/snippets/amaview-area-queimada.conf pelo `amaview instalar`.

location /area-queimada/ {
    root /var/cache/amaview-area-queimada;
    types { application/json json; }
    gzip on;
    gzip_types application/json;
    # Cada geração tem pasta própria (AAAAMMDD_HHMM): o arquivo nunca muda.
    # Sem `always`: um 404 não pode ficar guardado por um ano.
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-area-queimada.log;
}

# O índice muda uma vez por dia (3h de Brasília).
location ~ ^/area-queimada/v\d+/indice\.json$ {
    root /var/cache/amaview-area-queimada;
    types { application/json json; }
    gzip on;
    gzip_types application/json;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-area-queimada.log;
}
