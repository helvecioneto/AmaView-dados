# Focos do GOES-19 (AmaView): CSV por varredura gerados pelo amaview-focos.
# Instalado em /etc/nginx/snippets/amaview-focos.conf pelo `amaview instalar`.

location /focos/ {
    root /var/cache/amaview-focos;
    types { text/csv csv; application/json json; }
    gzip on;
    gzip_types text/csv application/json;
    # Uma varredura nunca muda (o horário está no nome; formato novo vai para vN).
    # Sem `always`: um 404 não pode ficar guardado por um ano.
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-focos.log;
}

# O índice muda a cada varredura nova.
location ~ ^/focos/v\d+/indice\.json$ {
    root /var/cache/amaview-focos;
    types { application/json json; }
    gzip on;
    gzip_types application/json;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-focos.log;
}
