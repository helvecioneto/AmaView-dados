# Qualidade do ar (AmaView): arquivos estáticos gerados pelo amaview-ar.
# Instalado em /etc/nginx/snippets/amaview-ar.conf pelo `amaview instalar`.

location /ar/ {
    root /var/cache/amaview-ar;
    types { application/json json; }
    gzip on;
    gzip_types application/json;
    gzip_comp_level 5;
    # Os arquivos mudam a cada rodada (5 min; o modelo, de hora em hora): cache
    # curto, e o ETag responde 304 quando nada mudou.
    add_header Cache-Control "public, max-age=60, must-revalidate" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-ar.log;
}
