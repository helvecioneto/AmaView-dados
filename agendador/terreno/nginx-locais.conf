# Uso do solo e CAR no ponto de um foco (AmaView): repasse ao amaview-terreno.
# Instalado em /etc/nginx/snippets/amaview-terreno.conf pelo `amaview instalar`;
# o cache e o limite de taxa ficam em /etc/nginx/conf.d/amaview-terreno.conf
# (nginx-http.conf), porque só valem no bloco http.

# O terreno.py já manda CORS e Cache-Control: repetir o cabeçalho aqui faria o
# navegador ver "*, *" e recusar a resposta.
location /terreno/ {
    limit_req zone=amaview_terreno burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8096;
    proxy_read_timeout 30s;
    # A resposta de um ponto não muda: o terreno.py diz por quanto tempo
    # guardar (X-Accel-Expires; 2 min quando o CAR estava fora do ar).
    proxy_cache amaview_terreno;
    proxy_cache_key $request_uri;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating;
    add_header X-Cache $upstream_cache_status always;
    gzip on;
    gzip_types application/json;
    access_log /var/log/nginx/amaview-terreno.log;
}
