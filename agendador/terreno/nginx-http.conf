# Bloco http do terreno (AmaView): instalado em /etc/nginx/conf.d/amaview-terreno.conf
# pelo `amaview instalar`. O location fica em snippets/amaview-terreno.conf.

# Respostas por ponto (~2 KB): 200 MB guardam ~100 mil pontos, 30 dias sem uso.
proxy_cache_path /var/cache/nginx/amaview-terreno levels=1:2 keys_zone=amaview_terreno:10m
                 max_size=200m inactive=30d use_temp_path=off;

# Cada clique num foco é um pedido; 5 por segundo por IP (com rajada de 20 no
# location) basta para quem clica e barra quem tenta varrer o CAR por aqui.
limit_req_zone $binary_remote_addr zone=amaview_terreno_taxa:10m rate=5r/s;
