# Fumaça do GOES-19 (AmaView): arquivos estáticos gerados pelo amaview-fumaca.
# Instalado em /etc/nginx/snippets/amaview-fumaca.conf pelo `amaview instalar`.

location /fumaca/ {
    root /var/cache/amaview-fumaca;
    types { application/geo+json geojson; application/json json; }
    gzip on;
    gzip_types application/geo+json application/json;
    gzip_comp_level 5;
    # Um quadro nunca muda: o horário está no nome, e formato novo vai para outra versão (vN).
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-fumaca.log;
}

# O índice muda a cada quadro novo: o app pergunta a cada minuto.
location ~ ^/fumaca/v\d+/indice\.json$ {
    root /var/cache/amaview-fumaca;
    types { application/json json; }
    gzip on;
    gzip_types application/json;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-fumaca.log;
}
