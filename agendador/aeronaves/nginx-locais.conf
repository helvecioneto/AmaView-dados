# Aeronaves (AmaView): atual.json gerado a cada minuto pelo amaview-aeronaves.
# Instalado em /etc/nginx/snippets/amaview-aeronaves.conf pelo `amaview instalar`.
# Só a pasta publicada: o estado (/var/lib/amaview-aeronaves) tem a posição
# recente das aeronaves de fiscalização e não é servido.

location /aeronaves/ {
    root /var/cache/amaview-aeronaves;
    types { application/json json; }
    gzip on;
    gzip_types application/json;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-aeronaves.log;
}
