# Bloco http do retrato da denúncia (AmaView): instalado em
# /etc/nginx/conf.d/amaview-retrato.conf pelo `amaview instalar`. O location fica
# em snippets/amaview-retrato.conf.
#
# A chave fica só na memória do nginx (não vai a log).
limit_req_zone $binary_remote_addr zone=amaview_retrato_taxa:5m rate=1r/s;
