# Retrato da denúncia (AmaView): repasse ao amaview-retrato. Instalado em
# /etc/nginx/snippets/amaview-retrato.conf pelo `amaview instalar`; o limite de
# taxa fica em /etc/nginx/conf.d/amaview-retrato.conf (nginx-http.conf).
#
# Sem registro de acesso nem de erro: quem pede o retrato de um foco é quem o
# está denunciando, e o IP ao lado do foco o identificaria.
location /retrato/ {
    access_log off;
    error_log /dev/null crit;
    limit_req zone=amaview_retrato_taxa burst=10 nodelay;
    limit_req_status 429;
    limit_req_log_level info;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8098;
    # O retrato junta as fontes na hora (até ~1 min com uma fonte lenta).
    proxy_read_timeout 90s;
    gzip on;
    gzip_types application/json;
}
