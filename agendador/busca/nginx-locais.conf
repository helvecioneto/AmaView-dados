# Busca em português (AmaView): o busca.py responde; aqui só o repasse.
# Instalado em /etc/nginx/snippets/amaview-busca.conf pelo `amaview instalar`.

# O busca.py já manda CORS e Cache-Control: repetir aqui faria o navegador ver
# "*, *". O X-Real-IP é o que o limite por IP do busca.py lê.
location /busca/ {
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
    # Só o código de resposta: o pedido (o que a pessoa escreveu) não vai para o log.
    access_log /var/log/nginx/amaview-busca.log amaview_busca;
}
