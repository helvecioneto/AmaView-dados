# Medições do GOES-19 (AmaView): PNGs e índices gerados pelo amaview-goes-l2.
# Instalado em /etc/nginx/snippets/amaview-goes-l2.conf pelo `amaview instalar`.

location /goes-l2/ {
    root /var/cache/amaview-goes-l2;
    types { image/png png; application/json json; }
    # Um quadro nunca muda: o horário está no nome, e formato novo vai para outra versão (vN).
    # Sem `always`: um 404 (quadro ainda não gravado, ou já apagado) não pode ficar guardado por um ano.
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-goes-l2.log;
}

# O índice muda a cada quadro novo: o app pergunta a cada minuto.
location ~ ^/goes-l2/v\d+/[a-z]+/indice\.json$ {
    root /var/cache/amaview-goes-l2;
    types { application/json json; }
    gzip on;
    gzip_types application/json;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-goes-l2.log;
}
