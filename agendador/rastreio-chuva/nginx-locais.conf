# Rastreio da chuva por satélite (AmaView): arquivos estáticos gerados pelo
# amaview-rastreio-chuva em /var/cache/amaview-rastreio-chuva.
# Instalado em /etc/nginx/snippets/amaview-rastreio-chuva.conf pelo `amaview instalar`.

location /rastreio-chuva/ {
    root /var/cache/amaview-rastreio-chuva;
    types { application/geo+json geojson; application/json json; }
    # O quadro já sai comprimido (.geojson.gz ao lado): nada de gzip por pedido.
    gzip_static on;
    # Um quadro nunca muda: o horário está no nome, e formato novo vai para outra versão (vN).
    # Sem `always`: um 404 (quadro ainda não gravado, ou já apagado) não pode ficar guardado por um ano.
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-rastreio-chuva.log;
}

# O índice muda a cada horário novo: o app pergunta a cada minuto.
location ~ ^/rastreio-chuva/v\d+/indice\.json$ {
    root /var/cache/amaview-rastreio-chuva;
    types { application/json json; }
    gzip on;
    gzip_types application/json;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-rastreio-chuva.log;
}
