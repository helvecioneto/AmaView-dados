# Previsão do ECMWF e do CAMS (AmaView): arquivos estáticos gerados pelo amaview-previsao.
# Instalado em /etc/nginx/snippets/amaview-previsao.conf pelo `amaview instalar`.

location /previsao/ {
    root /var/cache/amaview-previsao;
    types { application/octet-stream bin; application/json json; }
    gzip on;
    gzip_types application/octet-stream application/json;
    gzip_comp_level 5;
    # Uma rodada nunca muda: a hora dela está no caminho, e formato novo vai para outra versão (vN).
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-previsao.log;
}

# O índice muda quando entra rodada nova: o app revalida (304 quando nada mudou).
location ~ ^/previsao/v\d+/indice\.json$ {
    root /var/cache/amaview-previsao;
    types { application/json json; }
    gzip on;
    gzip_types application/json;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-previsao.log;
}

# Cenários do Google WeatherNext 2 (amaview-previsao-wn2): ACESSO RESTRITO. Os
# termos do Google para a previsão em tempo real só permitem a distribuição
# controlada a pessoas identificadas (uso educacional), então tudo aqui pede
# usuário e senha (/etc/amaview/wn2.htpasswd, fora do repositório). O app manda
# o cabeçalho Authorization; o preflight do CORS (OPTIONS) passa sem senha. O
# dado fica em restrito/, fora da raiz da location /previsao/: sem este trecho,
# 404 (falha fechada), nunca o dado aberto.
location ^~ /previsao/v1/wn2/ {
    root /var/cache/amaview-previsao/restrito;
    types { application/octet-stream bin; application/json json; text/plain txt; application/pdf pdf; }
    gzip on;
    gzip_types application/octet-stream application/json text/plain;
    gzip_comp_level 5;
    auth_basic "AmaView - pesquisa";
    auth_basic_user_file /etc/amaview/wn2.htpasswd;
    # Nada guardado: nem cache compartilhado, nem o disco do navegador depois de "Sair" (o app guarda os passos em memória).
    add_header Cache-Control "private, no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Headers "Authorization" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Max-Age "86400" always;
    if ($request_method = OPTIONS) { return 204; }
    access_log /var/log/nginx/amaview-previsao.log;

    location ~ /(indice\.json|termos\.txt|terms-of-use\.pdf)$ {
        add_header Cache-Control "private, no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Headers "Authorization" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Max-Age "86400" always;
        if ($request_method = OPTIONS) { return 204; }
    }
}
