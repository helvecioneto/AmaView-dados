# Estações meteorológicas (AmaView): arquivos estáticos gerados pelo amaview-meteo.
# Instalado em /etc/nginx/snippets/amaview-meteo.conf pelo `amaview instalar`.

# Os dois arquivos mudam a cada 5 min: `no-cache` faz o navegador revalidar
# (o nginx responde 304 pelo ETag quando nada mudou).
location /meteo/ {
    root /var/cache/amaview-meteo;
    types { application/json json; }
    gzip on;
    gzip_types application/json;
    gzip_comp_level 6;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-meteo.log;
}
