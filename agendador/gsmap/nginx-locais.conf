# Chuva por satélite do GSMaP (AmaView): arquivos estáticos gerados pelo amaview-gsmap.
# Instalado em /etc/nginx/snippets/amaview-gsmap.conf pelo `amaview instalar`.

location /gsmap/ {
    root /var/cache/amaview-gsmap;
    types { application/octet-stream bin; application/json json; }
    # O quadro já sai comprimido (.bin.gz ao lado do .bin): nada de gzip por pedido.
    gzip_static on;
    # Um quadro nunca muda: o horário e o produto estão no nome, e formato novo vai para outra versão (vN).
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-gsmap.log;
}

# O índice muda a cada horário novo: o app pergunta a cada minuto.
location ~ ^/gsmap/v\d+/indice\.json$ {
    root /var/cache/amaview-gsmap;
    types { application/json json; }
    gzip on;
    gzip_types application/json;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-gsmap.log;
}
