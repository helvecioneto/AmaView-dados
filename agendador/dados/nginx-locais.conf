# AmaView-dados servido pela Oracle (agendador/dados): CEMADEN, radar, rios,
# embarcações e sondagem, no lugar do GitHub Pages desde 08/11/2026.
# Instalado em /etc/nginx/snippets/amaview-dados.conf pelo `amaview instalar`.
#
# Cada camada é um link simbólico para a versão em dia (troca atômica pelo
# ciclo.sh). O open_file_cache do site guarda o caminho resolvido por até
# 60 s: depois de uma troca, um JSON pode vir da versão anterior por esse
# tempo — a anterior fica no disco justamente para isso.

location /dados/ {
    root /var/cache/amaview-dados;
    types { application/json json; image/png png; text/html html; }
    gzip on;
    gzip_types application/json;
    # Manifestos e séries mudam a cada ciclo (o app ainda põe ?m= no pedido).
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-dados.log;
}

# Uma varredura do radar nunca muda: o instante está no nome.
# Sem `always`: um 404 (ainda não chegou, ou já saiu da janela) não fica guardado.
location ~ ^/dados/radar/[a-z0-9]+/[a-z]+/[0-9_]+\.png$ {
    root /var/cache/amaview-dados;
    types { image/png png; }
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-dados.log;
}
