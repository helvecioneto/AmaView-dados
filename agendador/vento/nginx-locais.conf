# Vento do ECMWF (AmaView): arquivos por horário e o índice gerados pelo amaview-vento.
# Instalado em /etc/nginx/snippets/amaview-vento.conf pelo `amaview instalar`.

location /vento/ {
    root /var/cache/amaview-vento;
    types { application/octet-stream bin; application/json json; }
    gzip on;
    gzip_types application/octet-stream application/json;
    gzip_comp_level 6;
    # Horário e rodada estão no nome: o arquivo nunca muda (um passo melhor é outro arquivo).
    # Sem `always`: um 404 não pode ficar guardado por um ano.
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*" always;
    add_header Timing-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-vento.log;
}

# O índice muda a cada rodada nova (de 6 em 6 h).
location ~ ^/vento/v\d+/indice\.json$ {
    root /var/cache/amaview-vento;
    types { application/json json; }
    gzip on;
    gzip_types application/json;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    access_log /var/log/nginx/amaview-vento.log;
}
