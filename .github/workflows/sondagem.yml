name: Sondagem — radiossonda

# Quatro vezes por dia, e não a cada 15 minutos.
#
# O balão sobe 2× por dia (00Z e 12Z), e a sondagem fica disponível no Wyoming
# umas 7 h depois — medido: a das 12Z apareceu às 19:00 UTC. Buscar de 15 em 15
# minutos eram ~8.000 requisições diárias a um servidor acadêmico sem SLA para
# um dado que muda duas vezes. Aqui são ~340.
#
# Dois horários por sondagem: o primeiro pega o caso normal, o segundo cobre
# atraso na publicação. Minutos deslocados, pelo mesmo motivo do outro workflow.
#
# Quem dispara de verdade é o agendador externo (`agendador/amaview-sondagem.timer`,
# nos mesmos horários). O `schedule` aqui é só a rede de segurança: em
# 21/09/2026, dependendo só dele, a sondagem passou 12 h sem atualizar — de
# dois horários vencidos, o GitHub entregou um, com ~4 h de atraso.
on:
  schedule:
    - cron: '22 7,10,19,22 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Este workflow NÃO publica no Pages: ele busca e entrega o resultado ao ciclo
# da chuva pelo cache do Actions, e a chuva publica em até 15 min.
#
# Antes ele publicava, no grupo `publicar-pages` compartilhado com a chuva, e
# isso tinha dois defeitos:
# - o grupo guarda uma execução rodando e UMA pendente; a sondagem pendente
#   atrás da chuva era cancelada em silêncio quando chegava o ciclo seguinte;
# - a busca no Wyoming leva de 6 a 12 min (724 s medidos), e segurava o
#   grupo esse tempo todo, atrasando a chuva, que é o produto principal.
# Fora do grupo, nenhum dos dois acontece. O custo — até 15 min a mais para ir
# ao ar — não pesa para um dado que chega ~7 h depois do lançamento.
concurrency:
  group: sondagem
  cancel-in-progress: false

jobs:
  buscar:
    name: Buscar e entregar à chuva
    runs-on: ubuntu-latest
    # 724 s medidos numa busca normal, contra 15 min de teto antes. Fora do
    # grupo do Pages, a folga não atrasa mais ninguém.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Testes
        run: node --test scripts/wyoming.test.mjs

      - name: Buscar as sondagens
        run: node scripts/sondagem.mjs

      - name: Conferir os perfis
        run: |
          set -e
          for f in site/sondagem/estacoes.json site/sondagem/perfis.json site/sondagem/manifest.json; do
            test -s "$f" || { echo "::error::$f vazio ou ausente"; exit 1; }
          done
          node -e '
            const j = JSON.parse(require("fs").readFileSync("site/sondagem/perfis.json", "utf8"));
            if (!Array.isArray(j.perfis) || j.perfis.length === 0) throw new Error("sem perfis");
            const comDado = j.perfis.filter((p) => p.ms && p.niveis.length).length;
            // A rede falha de verdade, mas zero estações significa que quebramos algo.
            if (comDado === 0) throw new Error("nenhuma estação com sondagem — formato mudou?");
            console.log(`${comDado} de ${j.perfis.length} perfis com dado`);
          '

      # A entrega: o ciclo da chuva restaura a entrada MAIS NOVA com este
      # prefixo antes de publicar (`restore-keys`). Só chega aqui o que passou
      # na conferência acima — um ciclo que falhou não entrega nada, e a chuva
      # segue publicando a sondagem anterior.
      #
      # A chave é única por execução porque uma entrada de cache é imutável.
      # Quem apaga as antigas é a chuva, que tem `actions: write`.
      - name: Entregar ao ciclo da chuva
        uses: actions/cache/save@v5
        with:
          path: site/sondagem
          key: sondagem-v1-${{ github.run_id }}-${{ github.run_attempt }}
