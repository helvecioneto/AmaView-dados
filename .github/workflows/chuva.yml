name: Chuva — CEMADEN

# DUAS listas de horários, em minutos deslocados dos :00/:15/:30/:45.
#
# O agendamento do GitHub não é confiável e não há como torná-lo confiável
# aqui dentro. Medido neste repositório: pedindo 15 minutos, o intervalo real
# entre disparos foi de **135 minutos em média** (mediana 153, máximo 153) —
# nove vezes pior que o pedido. O `*/10` original não disparou nenhuma vez em
# 1h42.
#
# As duas listas dobram as tentativas por hora, o que é barato e ajuda na
# margem. Não resolve: quem quiser cadência de verdade precisa chamar o
# `workflow_dispatch` de fora do GitHub (ver o README).
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
    - cron: '9,24,39,54 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  # Só para a faxina dos depósitos antigos do radar (`gh cache delete`). O
  # cache em si não usa o GITHUB_TOKEN, e nada aqui dispara outro workflow.
  actions: write

# Grupo COMPARTILHADO com o workflow das sondagens.
#
# Os dois publicam no mesmo site do Pages, e cada publicação substitui o site
# inteiro. Se rodassem ao mesmo tempo, um leria o estado do ar enquanto o outro
# ainda não tinha publicado o dele, e o segundo a terminar apagaria o primeiro.
concurrency:
  group: publicar-pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Buscar e publicar
    runs-on: ubuntu-latest
    # Teto absoluto. O ciclo normal leva 1,5–4,5 min; um passo pendurado sem
    # este limite seguraria o grupo `publicar-pages` e cancelaria os ciclos
    # seguintes um a um, com a chuva congelada no ar.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Testes
        run: node --test scripts/serie.test.mjs scripts/cemaden.test.mjs scripts/navios.test.mjs scripts/rios.test.mjs scripts/radar.test.mjs

      - name: Buscar o CEMADEN e montar a grade
        env:
          # O JWT da PED é de vida curta e o `exp` não é confiável, então o que
          # fica guardado são as credenciais: cada ciclo pede um token novo.
          CEMADEN_EMAIL: ${{ secrets.CEMADEN_EMAIL }}
          CEMADEN_SENHA: ${{ secrets.CEMADEN_SENHA }}
          BASE_URL: ${{ vars.BASE_URL || 'https://helvecioneto.github.io/AmaView-dados' }}
        run: node scripts/build.mjs

      # Se o passo acima falhar, o job para aqui e NADA é publicado: a versão
      # anterior continua no ar.
      - name: Conferir a grade
        run: |
          set -e
          for f in site/cemaden/estacoes.json site/cemaden/serie.json site/cemaden/manifest.json; do
            test -s "$f" || { echo "::error::$f vazio ou ausente"; exit 1; }
          done
          node -e '
            const j = JSON.parse(require("fs").readFileSync("site/cemaden/serie.json", "utf8"));
            if (!Array.isArray(j.v) || j.v.length === 0) throw new Error("grade vazia");
            if (j.v.some((l) => l.length !== j.slots)) throw new Error("linha com tamanho errado");
            console.log(`grade validada: ${j.v.length} x ${j.slots}`);
          '

      # As embarcações rodam DENTRO deste ciclo, e não num workflow próprio.
      #
      # O grupo `publicar-pages` guarda no máximo uma execução rodando e uma
      # pendente: quando uma terceira entra, a PENDENTE é cancelada — em
      # silêncio, com status `cancelled` e não `failure`. Um terceiro workflow
      # na mesma cadência comeria ciclos da chuva sem ninguém perceber.
      #
      # `continue-on-error`: a chuva é o produto principal. Se o AIS estiver
      # fora do ar, o ciclo publica a chuva do mesmo jeito e a camada de
      # barcos fica com o dado do ciclo anterior.
      - name: Buscar as embarcações (AIS)
        id: navios
        continue-on-error: true
        timeout-minutes: 4
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://helvecioneto.github.io/AmaView-dados' }}
          OPENWATERS_TOKEN: ${{ secrets.OPENWATERS_TOKEN }}
        run: node scripts/navios.mjs

      # Os rios rodam DENTRO deste ciclo, como as embarcações, e pelo mesmo
      # motivo: um terceiro workflow no grupo `publicar-pages` cancelaria a
      # execução pendente em silêncio.
      #
      # Mas só de HORA EM HORA, e não a cada 15 min: o nível de um rio
      # amazônico muda de 5 a 30 cm por DIA, e buscar 154 estações a cada
      # ciclo seriam ~15 mil requisições diárias a um serviço público para um
      # dado que não mudou. O próprio script confere o carimbo da publicação
      # anterior e sai em silêncio quando ainda não venceu.
      - name: Buscar o nível dos rios (ANA)
        id: rios
        continue-on-error: true
        # O script tem prazo próprio de 5 min na coleta; isto é o teto do
        # que sobra (releitura, SACE, escrita). Estourar conta como falha e o
        # preservar restaura a pasta do ar.
        timeout-minutes: 7
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://helvecioneto.github.io/AmaView-dados' }}
        run: node scripts/rios.mjs

      # O estado do radar entre ciclos vem do CACHE DO ACTIONS, e não do Pages
      # como nas outras camadas.
      #
      # São ~4.700 PNG e ~85 MB para 48 h (medido em 21/09/2026). Reler isso do
      # Pages a cada ciclo seriam ~8 GB por dia, 240 GB por mês — mais que o
      # dobro do limite brando de banda do Pages (100 GB/mês), gasto só por
      # este workflow, antes do primeiro visitante. O cache do Actions não
      # entra nessa conta.
      #
      # A chave é única por execução porque uma entrada de cache é imutável:
      # uma chave já salva não aceita conteúdo novo. O `restore-keys` pega a
      # mais recente. Cache ausente (estreia, ou despejado) não é erro: o
      # script baixa do Pages só o que falta.
      - name: Restaurar o depósito dos radares
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: radar-cache
          key: radar-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-v1-

      # Os radares rodam DENTRO deste ciclo, pelo mesmo motivo das embarcações
      # e dos rios: um terceiro workflow no grupo `publicar-pages` cancelaria
      # a execução pendente em silêncio.
      #
      # `continue-on-error`: a chuva é o produto principal. Com o SIPAM fora,
      # o ciclo publica a chuva do mesmo jeito e o `--preservar` abaixo põe
      # no ar o depósito do ciclo anterior.
      - name: Buscar os radares (SIPAM)
        id: radar
        continue-on-error: true
        # O script tem prazo próprio de 4 min para listar e baixar; isto é o
        # teto do que sobra (poda, cópia de ~85 MB para site/, resumo).
        # Estourar conta como falha e o preservar publica o depósito.
        timeout-minutes: 7
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://helvecioneto.github.io/AmaView-dados' }}
        run: node scripts/radar.mjs

      # Este ciclo não reconstrói as sondagens, e publicar sem elas as apagaria
      # do ar até o outro workflow rodar — o que pode levar horas.
      - name: Preservar as sondagens
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://helvecioneto.github.io/AmaView-dados' }}
        run: node scripts/preservar.mjs sondagem

      # Só restaura o que o passo acima NÃO construiu (`preservar.mjs` mantém
      # os arquivos deste ciclo). Não pode derrubar a publicação da chuva: na
      # estreia da pasta não há nada no ar para restaurar, e uma falha do AIS
      # custa uma camada, não o portal.
      # Sem `continue-on-error`: publicar o site sem a pasta apagaria a camada
      # do ar até o produtor voltar (com a ANA fora, por dias). Falhar o ciclo
      # é mais barato — a publicação anterior continua no ar. O `baixar()`
      # já repete três vezes, então só uma queda real do Pages chega aqui.
      - name: Preservar as embarcações
        if: steps.navios.outcome == 'failure'
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://helvecioneto.github.io/AmaView-dados' }}
        run: node scripts/preservar.mjs navios

      # `rodou=false` quer dizer que o passo PULOU (ainda não venceu a hora),
      # que é diferente de ter falhado — nos dois casos a pasta precisa voltar
      # do ar, senão a camada some do mapa.
      - name: Preservar o nível dos rios
        if: steps.rios.outputs.rodou != 'true'
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://helvecioneto.github.io/AmaView-dados' }}
        run: node scripts/preservar.mjs rios

      # Qualquer desfecho que não seja sucesso — falha, SIPAM fora, prazo do
      # passo estourado — e a pasta precisa voltar, senão a camada some do
      # mapa. Vem do depósito restaurado do cache (zero banda do Pages) ou,
      # com o cache perdido, do Pages. Não é o `preservar.mjs`: esse relê a
      # pasta inteira do ar, e aqui são milhares de PNG.
      # Sem `continue-on-error`, pela regra dos vizinhos: publicar sem a pasta
      # apagaria o radar do ar; falhar mantém a publicação anterior.
      - name: Preservar os radares
        if: steps.radar.outcome != 'success'
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://helvecioneto.github.io/AmaView-dados' }}
        run: node scripts/radar.mjs --preservar

      # Guarda o depósito ANTES de publicar: se o deploy falhar, o trabalho de
      # baixar do SIPAM não se perde.
      #
      # `always()` para guardar também quando um passo posterior ao radar
      # falhou (as sondagens, por exemplo) — o depósito continua bom. Mas só
      # quando há o que guardar, e as duas condições evitam salvar lixo:
      # - `site/radar/manifest.json`: o ciclo (ou o preservar) terminou. Sem
      #   ele o passo morreu no meio, ou nem rodou;
      # - `radar-cache/manifest.json`: o depósito está completo. Sem ele o
      #   próximo ciclo trataria o depósito como perdido do mesmo jeito.
      # Os PNG são gravados com nome provisório e renomeados, então um
      # depósito salvo nunca tem arquivo pela metade.
      - name: Guardar o depósito dos radares
        if: always() && hashFiles('site/radar/manifest.json') != '' && hashFiles('radar-cache/manifest.json') != ''
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: radar-cache
          key: radar-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      # Faxina dos depósitos antigos. Cada ciclo salva uma entrada nova de
      # ~85 MB (a chave é única por execução): 96 por dia passariam dos 10 GB
      # de cache do repositório em pouco mais de um dia, e o GitHub começaria
      # a despejar por conta própria, sem critério nosso. Ficam as duas mais
      # novas: a deste ciclo e a anterior, de reserva.
      #
      # Depois do deploy, para não atrasar a publicação; `always()` porque o
      # depósito deste ciclo foi salvo antes, publique ele ou não. Falhar aqui
      # não é grave — a faxina do ciclo seguinte recolhe o que sobrou.
      - name: Apagar depósitos antigos dos radares
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --key radar-v1- --sort created_at --order desc --limit 100 --json id --jq '.[2:][].id' |
            while read -r id; do
              gh cache delete "$id"
            done
